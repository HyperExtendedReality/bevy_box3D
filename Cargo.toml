[package]
name = "bevy_box3d"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Box3D physics integrated with Bevy ECS"
publish = false

[dependencies]
bevy_app = { path = "../../bevy/crates/bevy_app", default-features = false, features = ["std"] }
bevy_ecs = { path = "../../bevy/crates/bevy_ecs", default-features = false, features = ["std"] }
bevy_math = { path = "../../bevy/crates/bevy_math", default-features = false, features = ["std"] }
bevy_time = { path = "../../bevy/crates/bevy_time", default-features = false, features = ["std"] }
bevy_transform = { path = "../../bevy/crates/bevy_transform", default-features = false, features = ["std", "bevy-support"] }

[build-dependencies]
cc = "1"
