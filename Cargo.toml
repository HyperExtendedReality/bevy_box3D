[package]
name = "bevy_box3d"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Box3D physics integrated with Bevy ECS"
publish = false

[dependencies]
bevy_app = { version = "0.20.0", default-features = false, features = ["std"] }
bevy_ecs = { version = "0.20.0", default-features = false, features = ["std"] }
bevy_math = { version = "0.20.0", default-features = false, features = ["std"] }
bevy_time = { version = "0.20.0", default-features = false, features = ["std"] }
bevy_transform = { version = "0.20.0", default-features = false, features = ["std", "bevy-support"] }

[build-dependencies]
cc = "1"
